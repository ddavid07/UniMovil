name: Native mobile
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: Fixtures reproducibles o MapTiler real (requiere MAPTILER_PUBLIC_CLIENT_KEY)
        type: choice
        options: [automatic, live]
        default: automatic
      repetitions:
        description: Consecutive runs on the same commit
        type: choice
        options: ["1", "3"]
        default: "3"
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: Configure native validation
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      modes: ${{ steps.matrix.outputs.modes }}
      live: ${{ steps.matrix.outputs.live }}
    steps:
      - id: matrix
        env:
          KEY_CONFIGURED: ${{ secrets.MAPTILER_PUBLIC_CLIENT_KEY != '' }}
          LIVE_REQUESTED: ${{ inputs.provider == 'live' }}
        run: |
          if [ "$LIVE_REQUESTED" = true ] && [ "$KEY_CONFIGURED" != true ]; then
            echo '::error::Falta MAPTILER_PUBLIC_CLIENT_KEY para validar MapTiler real.'
            exit 1
          fi
          modes='["fixture","fixture-error"]'
          if [ "$KEY_CONFIGURED" = true ]; then
            modes='["fixture","fixture-error","live"]'
          fi
          printf 'modes=%s\nlive=%s\n' "$modes" "$KEY_CONFIGURED" >> "$GITHUB_OUTPUT"
  native:
    name: Mobile ${{ matrix.platform }} (${{ matrix.mode }})
    needs: configuration
    strategy:
      fail-fast: false
      matrix:
        platform: [Android, iOS]
        mode: ${{ fromJSON(needs.configuration.outputs.modes) }}
    runs-on: ${{ matrix.platform == 'Android' && 'ubuntu-24.04' || 'macos-26' }}
    timeout-minutes: 60
    env:
      CI: "true"
      APP_VARIANT: ${{ matrix.mode == 'live' && 'preview' || 'e2e' }}
      EXPO_PUBLIC_MAPTILER_KEY: ${{ matrix.mode == 'live' && secrets.MAPTILER_PUBLIC_CLIENT_KEY || '' }}
      EXPO_PUBLIC_MAP_MODE: ${{ matrix.mode }}
      E2E_REPETITIONS: ${{ inputs.repetitions || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run build:packages
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate live configuration
        if: matrix.mode == 'live'
        run: test -n "$EXPO_PUBLIC_MAPTILER_KEY"
      - name: Install verified Maestro CLI
        run: bash scripts/install-maestro.sh
      - name: Record toolchain
        run: |
          node --version
          npm --version
          java -version
          maestro --version
      - name: Generate Android project
        if: matrix.platform == 'Android'
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Check Android command-line tools before compilation
        if: matrix.platform == 'Android'
        run: |
          source scripts/android-tools.sh
          sdkmanager --version
          adb version
          sdkmanager 'emulator' > "$RUNNER_TEMP/unimovil-emulator-install.log"
          test -x "$ANDROID_HOME/emulator/emulator"
      - name: Build bundled Android APK
        if: matrix.platform == 'Android'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64
      - name: Allow emulator acceleration
        if: matrix.platform == 'Android'
        run: sudo chmod 666 /dev/kvm
      - name: Run Android acceptance flows
        if: matrix.platform == 'Android'
        run: bash scripts/android-e2e.sh
      - name: Select pinned Xcode
        if: matrix.platform == 'iOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Generate iOS project
        if: matrix.platform == 'iOS'
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Build bundled iOS simulator app
        if: matrix.platform == 'iOS'
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          pod install --project-directory=ios
          xcodebuild -workspace ios/UniMovil.xcworkspace -scheme UniMovil -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent ios/build/Build/Products/Release-iphonesimulator/UniMovil.app "$RUNNER_TEMP/UniMovil-ios.app.zip"
      - name: Run iOS acceptance flows
        if: matrix.platform == 'iOS'
        run: bash scripts/ios-e2e.sh
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.mode }}
          retention-days: 7
          path: |
            test-results/
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/ios/Podfile.lock
            ${{ runner.temp }}/UniMovil-ios.app.zip
            ${{ runner.temp }}/unimovil-*.log

  acceptance:
    name: Native acceptance
    timeout-minutes: 5
    if: always()
    needs: [configuration, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require native execution and live provider
        env:
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          LIVE_CONFIGURED: ${{ needs.configuration.outputs.live }}
        run: |
          test "$CONFIGURATION_RESULT" = success
          test "$NATIVE_RESULT" = success
          if [ "$LIVE_CONFIGURED" != true ]; then
            echo '::error::La aceptación requiere configurar MAPTILER_PUBLIC_CLIENT_KEY y ejecutar los flujos con MapTiler real. Las fixtures no completan esa validación.'
            exit 1
          fi
