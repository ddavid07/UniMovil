name: Native mobile
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: Fixtures reproducibles o MapTiler real (requiere MAPTILER_PUBLIC_CLIENT_KEY)
        type: choice
        options: [fixtures, live]
        default: fixtures
      repetitions:
        description: Consecutive runs on the same commit
        type: choice
        options: ["1", "3"]
        default: "3"
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Mobile ${{ matrix.platform }} (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        platform: [Android, iOS]
        mode: ${{ fromJSON(inputs.provider == 'live' && '["live"]' || '["fixture", "fixture-error"]') }}
    runs-on: ${{ matrix.platform == 'Android' && 'ubuntu-24.04' || 'macos-26' }}
    timeout-minutes: 60
    env:
      CI: "true"
      APP_VARIANT: ${{ matrix.mode == 'live' && 'preview' || 'e2e' }}
      EXPO_PUBLIC_MAPTILER_KEY: ${{ matrix.mode == 'live' && secrets.MAPTILER_PUBLIC_CLIENT_KEY || '' }}
      EXPO_PUBLIC_MAP_MODE: ${{ matrix.mode }}
      E2E_REPETITIONS: ${{ inputs.repetitions || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run build:packages
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate live configuration
        if: matrix.mode == 'live'
        run: test -n "$EXPO_PUBLIC_MAPTILER_KEY"
      - name: Install verified Maestro CLI
        run: bash scripts/install-maestro.sh
      - name: Record toolchain
        run: |
          node --version
          npm --version
          java -version
          maestro --version
      - name: Generate Android project
        if: matrix.platform == 'Android'
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build bundled Android APK
        if: matrix.platform == 'Android'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Allow emulator acceleration
        if: matrix.platform == 'Android'
        run: sudo chmod 666 /dev/kvm
      - name: Run Android acceptance flows
        if: matrix.platform == 'Android'
        run: bash scripts/android-e2e.sh
      - name: Select pinned Xcode
        if: matrix.platform == 'iOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Generate iOS project
        if: matrix.platform == 'iOS'
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Build bundled iOS simulator app
        if: matrix.platform == 'iOS'
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          pod install --project-directory=ios
          xcodebuild -workspace ios/UniMovil.xcworkspace -scheme UniMovil -configuration Release -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent ios/build/Build/Products/Release-iphonesimulator/UniMovil.app "$RUNNER_TEMP/UniMovil-ios.app.zip"
      - name: Run iOS acceptance flows
        if: matrix.platform == 'iOS'
        run: bash scripts/ios-e2e.sh
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.mode }}
          retention-days: 7
          path: |
            test-results/
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/UniMovil-ios.app.zip
            ${{ runner.temp }}/unimovil-*.log
