name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, platform bundles and web smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Run API unit tests
        run: npm run api:test

      - name: Start local Supabase
        run: SUPABASE_EXPERIMENTAL_STACK=1 npx supabase start --runtime docker --eager > /dev/null

      - name: Migrate and integration-test API against local Supabase
        run: npm run local:env && npm run db:setup-local && npm run test:local-supabase

      - name: Stop local Supabase
        if: always()
        run: SUPABASE_EXPERIMENTAL_STACK=1 npx supabase stop > /dev/null 2>&1 || true

      - name: Check Expo package compatibility
        run: npm run check:expo

      - name: Export Android bundle
        run: npm run export:android

      - name: Export iOS bundle
        run: npm run export:ios

      - name: Export web application
        run: npm run export:web

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the web application
        run: npm run test:web
