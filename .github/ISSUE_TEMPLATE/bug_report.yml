name: Informe de error
description: Comunica un comportamiento inesperado de UniMovil.
title: '[Error]: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Descripción
      description: Explica qué comportamiento observaste.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre la aplicación...
        2. Busca...
        3. Observa...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Indica versión de la aplicación, plataforma y dispositivo.
    validations:
      required: true
