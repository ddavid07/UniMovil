name: Informe de error
description: Comunica un comportamiento incorrecto de UniMovil.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: No incluyas contraseñas, tokens, datos personales ni ubicaciones privadas.
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería ocurrir?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento observado
      description: ¿Qué ocurre en realidad?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Describe pasos mínimos y reproducibles.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Aplicación y versión, sistema operativo y dispositivo.
    validations:
      required: true
